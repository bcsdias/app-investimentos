name: Update B3 Cache

on:
  schedule:
    - cron: '0 0 1 * *' # Executa no primeiro dia de cada mês
  workflow_dispatch: # Permite execução manual

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium webdriver-manager

      - name: Run B3 Scraper
        run: python scripts/update_b3_cache.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/static/*_all.csv
          # O "|| echo" previne que a action falhe se não houver mudanças
          git commit -m "chore(data): auto-update B3 static CSV indices" || echo "No changes to commit"
          git push
