server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;
    absolute_redirect off;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # A porta é publicada só em 127.0.0.1 e o docker-proxy entrega toda conexão com o IP
    # do gateway da bridge (172.16.0.0/12). Se houver um proxy à frente (túnel/reverse
    # proxy no host) mandando X-Forwarded-For, usa o cliente real; sem ele, o rate limit
    # de login vê o gateway e vale efetivamente por usuário (ADR 0020).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        set $backend "http://lab-appinvest-backend:8000";
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /admin/ {
        set $backend "http://lab-appinvest-backend:8000";
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
